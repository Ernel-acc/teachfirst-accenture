// ── Supabase config ───────────────────────────────────────────────
const SUPABASE_URL = 'https://kygqpykrrugpgdrzgozl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vRVIyFanDgzolFQ6zGKsYg_s6dg_Wlx';
const SB = (path, opts={}) => fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
  headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },
  ...opts
});

// ── PIN lock system ───────────────────────────────────────────────
let editUnlocked = false;

async function toggleLock() {
  if (editUnlocked) {
    editUnlocked = false;
    updateLockUI();
    return;
  }
  const pin = prompt('Enter PIN to unlock editing:');
  if (!pin) return;
  const hash = await sha256(pin);
  const res = await SB("config?key=eq.pin_hash&select=value").then(r => r.json());
  if (res[0]?.value === hash) {
    editUnlocked = true;
    updateLockUI();
    alert('✅ Edit mode unlocked!');
  } else {
    alert('❌ Incorrect PIN');
  }
}

function updateLockUI() {
  const btn = document.getElementById('lockBtn');
  if (!btn) return;
  btn.textContent = editUnlocked ? '🔓' : '🔒';
  btn.title = editUnlocked ? 'Click to lock' : 'Click to unlock editing';
  btn.style.background = editUnlocked ? '#e6ffe6' : '#fff0f0';
  btn.style.color = editUnlocked ? '#126747' : '#ba2538';
  // Show/hide edit buttons
  const addBtn = document.getElementById('add');
  if (addBtn) addBtn.style.opacity = editUnlocked ? '1' : '0.4';
}

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function syncToSupabase() {
  try {
    const events = D.events.map(e => ({
      id: e.id, title: e.title||'', date: e.date||null, status: e.status||'Proposed',
      society_id: e.societyId||null, organiser_id: e.organiserId||null,
      people_needed: e.peopleNeeded||0, category: e.category||'', notes: e.notes||'',
      checklist: e.checklist||{}, next_action: e.nextAction||{}, assignments: e.assignments||[],
      tags: e.tags||[], staff: e.staff||[], budgetAllocated: e.budget_allocated||0, budgetSpent: e.budget_spent||0
    }));
    const societies = D.societies.map(s => ({ id: s.id, name: s.name||'', colour: s.colour||'' }));
    const contacts = D.contacts.map(c => ({ id: c.id, society_id: c.societyId||null, name: c.name||'', primary_contact: c.primary||false }));
    const teamMembers = D.teamMembers.map(p => ({ id: p.id, name: p.name||'', role: p.role||'', programme_role: p.programmeRole||'Core Support', interests: p.interests||[], tags: p.tags||[], email: p.email||'' }));
    await Promise.all([
      SB('events', { method: 'POST', body: JSON.stringify(events) }),
      SB('societies', { method: 'POST', body: JSON.stringify(societies) }),
      SB('contacts', { method: 'POST', body: JSON.stringify(contacts) }),
      SB('team_members', { method: 'POST', body: JSON.stringify(teamMembers) })
    ]);
  } catch(err) {
    console.error('Supabase sync error:', err);
    alert('Could not save to Supabase: ' + err.message);
  }
}

    render();

        </div>
      </div>`;
    console.error('Supabase load error:', err);
  }
}

function addStaffToEvent(eid) {
  if(!editUnlocked){alert('🔒 Unlock edit mode first');return;}
  const sel = document.getElementById('staffpickpanel');
  if(!sel || !sel.value) return;
  const p = person(sel.value);
  if(!p.id) return;
  const e = D.events.find(x=>x.id===eid);
  if(!e) return;
  e.staff = e.staff||[];
  if(e.staff.find(s=>s.id===p.id)) return;
  e.staff.push({id:p.id, name:p.name});
  save();
  workspace();
}

function addStaffAdHocToEvent(eid, inp) {
  if(!editUnlocked){alert('🔒 Unlock edit mode first');return;}
  const name = inp.value.trim();
  if(!name) return;
  const e = D.events.find(x=>x.id===eid);
  if(!e) return;
  e.staff = e.staff||[];
  e.staff.push({id:'adhoc-'+Date.now(), name});
  inp.value = '';
  save();
  workspace();
}

function removeStaffFromEvent(eid, sid) {
  if(!editUnlocked){alert('🔒 Unlock edit mode first');return;}
  const e = D.events.find(x=>x.id===eid);
  if(!e) return;
  e.staff = (e.staff||[]).filter(s=>s.id!==sid);
  save();
  workspace();
}
